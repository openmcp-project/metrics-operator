name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release_publish:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app-token
        with:
          app-id: 1312871 # opencontrolplane-ci GitHub App
          private-key: ${{ secrets.OPENCONTROLPLANE_CI_PEM_FILE }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive

      - name: Publish
        uses: ./hack/common/.github/actions/publish
