name: CI

on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_validate_test:
    uses: openmcp-project/build/.github/workflows/ci.lib.yaml@44679799aa29439695a34378314eaa6ad2908527 # main
    secrets: inherit
