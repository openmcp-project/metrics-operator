name: CI

on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_validate_test:
    uses: openmcp-project/build/.github/workflows/ci.lib.yaml@ca63f82696e8311fa8494cfa59221a58f1787e59 # main
    secrets: inherit
